name: CI (TypeCheck, Audit, Test, Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: npm Audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Run Unit Tests
        run: npm run test

      - name: Run Performance Benchmarks (500 Devices Threshold < 3s)
        run: npm run test:perf

      - name: Build Project
        run: npm run build
