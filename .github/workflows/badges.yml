name: Update README Badges

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # No `ref:` pin — `github.head_ref` is only populated for `pull_request`
      # events and is always empty on `push`/`workflow_dispatch`, so pinning it
      # fell back to the default ref by accident rather than by intent.
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Count Lines and Update Badges
        run: node scripts/update-readme-badges.cjs

      - name: Commit if Changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update README badges (lines/files)"
          file_pattern: README.md
